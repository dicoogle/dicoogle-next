server {
    listen 3000;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

# WARNING: uncommnent this if you want to use a backend from outside
    
location /api/ {
    #         Change this to the intended url 
        proxy_pass https://demo.dicoogle.com; 
        rewrite ^/api/(.*) /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        #     change this to the intended url without https
        proxy_set_header Host demo.dicoogle.com;

        #  change these to the intended url
        proxy_set_header Origin https://demo.dicoogle.com;
        proxy_set_header Referer https://demo.dicoogle.com/;

        proxy_ssl_server_name on;
    }


# WARNING: If a backend from outside is being used comment this block

