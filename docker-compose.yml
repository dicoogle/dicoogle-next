version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: ./dockerfile.backend
    container_name: dicoogle-backend
    restart: unless-stopped
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./webapp/
      dockerfile: dockerfile
    container_name: dicoogle-frontend
    restart: unless-stopped
    ports:
      # CHANGE: Map Host 3000 -> Container 3000
      - "3000:3000"
    depends_on:
      - backend
