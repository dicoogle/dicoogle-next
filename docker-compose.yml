services:
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    container_name: dicoogle-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_STORAGE_FILE_RO_ROOT_DIR: /
    volumes:
      - dicoogle-data:/app/data
      - /home/jotalma13/FELIX:/home/jotalma13/FELIX

  frontend:
    build:
      context: ./webapp/
      dockerfile: dockerfile
      args:
        VITE_API_BASE_URL: "/next/api"
        BASE_PATH: "/next/"
        VITE_BASE_PATH: "/next"
        VITE_FILESYSTEM_START_PATH: "/"
    container_name: dicoogle-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  dicoogle-data:
