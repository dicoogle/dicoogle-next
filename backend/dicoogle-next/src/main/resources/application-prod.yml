spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    org.dicoogle: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  dimse:
    cmove:
      destinations: {}
  security:
    docs-enabled: false
    basic-auth:
      username: ${APP_SECURITY_BASIC_AUTH_USERNAME}
      password: ${APP_SECURITY_BASIC_AUTH_PASSWORD}
