spring:
  application:
    name: dicoogle-next
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    docs-enabled: false
    allowed-origins: []
  dimse:
    cstore:
      enabled: false
      ae-title: DICOOGLE
      bind-address: 0.0.0.0
      port: 11112
      storage-scheme: file
  storage:
    file-ro:
      root-dir: ./data/storage
    file-rw:
      enabled: false
      root-dir: ./data/storage
      scheme: file
  plugins:
    startup-validation:
      require-writable-provider: false
      writable-scheme: file
    storage:
      primary-scheme: file
      enabled-schemes: []
      disabled-schemes: []
