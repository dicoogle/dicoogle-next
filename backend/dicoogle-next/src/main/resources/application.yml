# Dicoogle Next application configuration

app:
  plugins:
    startup-validation:
      require-writable-provider: false
    storage:
      primary-scheme: file

# Legacy Dicoogle proxy — disabled by default.
# Enable when running alongside a legacy Dicoogle instance to proxy
# any requests that dicoogle-next does not yet handle natively.
dicoogle:
  legacy-proxy:
    enabled: false
    base-url: http://localhost:8080
    timeout: 30s
    auth:
      username: admin
      password: admin
