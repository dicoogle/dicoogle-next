spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    root: WARN
    org.dicoogle: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  query:
    lucene:
      root-dir: ./target/test-index
      index-name: dicoogle-lucene
      watch-storage: false
  dimse:
    cfind:
    cmove:
      destinations: {}
    cstore:
      enabled: false
  storage:
    file-ro:
      root-dir: ./target/test-storage/wado
    file-rw:
      enabled: false
  users:
    seed:
      username: dicoogle
      password: dicoogle
  security:
    docs-enabled: false
