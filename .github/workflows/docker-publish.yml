name: Publish Docker images

# Builds the backend and webapp images and pushes them to GitHub Container Registry:
#   ghcr.io/<owner>/dicoogle-next-backend
#   ghcr.io/<owner>/dicoogle-next-webapp
#
# Image tags:
#   <version>     project version from backend/pom.xml (e.g. 0.0.1, 0.0.2-SNAPSHOT)
#   sha-<short>   commit built
#   latest        only for releases: non-prerelease version whose v<version> tag points at the commit
#
# Triggers:
#   - pushing a v* tag (from a machine; tags pushed by GITHUB_TOKEN do not trigger workflows)
#   - manually:      gh workflow run docker-publish.yml --ref dev [-f ref=v0.0.1]
#   - from bump-version.yml after it pushes a release tag (workflow_call)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or SHA to build (defaults to the branch selected above)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Tag, branch or SHA to build"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-tags: true

      - name: Compute image names and tags
        id: meta
        run: |
          VERSION=$(awk '/<\/parent>/ {p=1; next} p && /<version>/ {gsub(/.*<version>|<\/version>.*/, ""); print; exit}' backend/pom.xml)
          [[ -n "$VERSION" ]] || { echo "::error::Could not read version from backend/pom.xml"; exit 1; }
          SHA=$(git rev-parse HEAD)
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          LATEST=false
          if [[ "$VERSION" != *-* ]] && git tag --points-at HEAD | grep -qx "v${VERSION}"; then
            LATEST=true
          fi

          for name in backend webapp; do
            image="${REGISTRY}/${OWNER}/dicoogle-next-${name}"
            {
              echo "${name}_tags<<EOF"
              echo "${image}:${VERSION}"
              echo "${image}:sha-${SHA::7}"
              [[ "$LATEST" == true ]] && echo "${image}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${SHA}"
            echo "org.opencontainers.image.version=${VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION (commit ${SHA::7}, latest=$LATEST)"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # The backend Dockerfile copies the prebuilt exec jar; tests already run in ci.yml.
      - name: Build backend jar
        working-directory: backend
        run: bash ./mvnw -B -ntp -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=dicoogle-next-backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Build args match docker-compose.yml (app served under /next, API proxied to backend:8080).
      - name: Build and push webapp image
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          file: ./webapp/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.webapp_tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=dicoogle-next-webapp
          build-args: |
            VITE_API_BASE_URL=/next/api
            BASE_PATH=/next/
            VITE_BASE_PATH=/next
            VITE_FILESYSTEM_START_PATH=/
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,mode=max,scope=webapp

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.backend_tags }}"
            echo "${{ steps.meta.outputs.webapp_tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
