name: CI/CD Pipeline (Docker)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, backend/implementation]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: FRONTEND QUALITY CHECKS (Runs on GitHub Cloud)
  # We keep this to ensure code is good before wasting time building on the VM
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./webapp/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # We run build here just to check for errors, but we DON'T upload artifacts.
      # The actual deployment build happens inside Docker on the VM.
      - name: Test Build
        run: npm run build

  # JOB 2: BACKEND QUALITY CHECKS (Runs on GitHub Cloud)
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/dicoogle-next/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw -B -ntp clean verify

      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
          if-no-files-found: ignore

